<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fahad Store - PS4 13.52</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background-color: #050b14;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.10),
            rgba(0,0,0,0.20)
        ),
        url("./background.jpg");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    font-family: Arial, sans-serif;

    overflow: hidden;
}

/* دائرة التحميل */
#spin {
    position: fixed;

    top: 50%;
    left: 50%;

    width: 46px;
    height: 46px;

    margin-left: -23px;
    margin-top: -23px;

    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #39a9ff;

    border-radius: 50%;

    animation: spin 0.9s linear infinite;

    z-index: 20;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* رسالة الخطأ - بدون كتابة */
#msg {
    position: fixed;

    top: 50%;
    left: 0;
    right: 0;

    transform: translateY(-50%);

    text-align: center;

    font-size: 20px;
    font-weight: bold;

    display: none;

    text-shadow: 0 0 10px black;
}

/* منطقة سجل التشغيل */
#wrap {
    padding: 0;
}

#state,
#out {
    display: none;
}

/* عند نجاح التشغيل */
body.done #spin {
    display: none;
}

/* عند فشل التشغيل */
body.fail #spin {
    display: none;
}

body.fail #msg {
    display: none;
}

/* وضع السجل */
body.log #spin,
body.log #msg {
    display: none;
}

body.log #wrap {
    padding: 70px 18px 14px;
}

body.log #state {
    display: block;

    font-size: 22px;
    font-weight: bold;

    margin-bottom: 8px;
}

body.log #out {
    display: block;

    white-space: pre-wrap;

    font:
        12px/1.45 Consolas,
        monospace;

    background: rgba(0,0,0,0.78);

    border: 1px solid #168cff;
    border-radius: 5px;

    padding: 10px 12px;

    height: calc(100vh - 160px);

    overflow-y: auto;
}

.ok,
.safe {
    color: #7fd0a0;
}

.bad,
.danger {
    color: #d08a7f;
}

.warn {
    color: #d8c07f;
}

code {
    color: #9fb3d0;
}
</style>
</head>

<body>

<div id="spin"></div>

<div id="msg"></div>

<div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
</div>

<script type="module">
    import "./jb.js?v=10";
</script>

</body>
</html>
